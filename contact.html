<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Navigation Bar -->

    <!-- Put this inside your navigation bar area -->

            <span class="bar"></span>

        </button>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html" class="active">Home</a></li>

        </ul>

    <!-- Interactive Contact Form Layout -->
    <main class="page-content">
        <h2 class="page-title">Contact Me</h2>
        <p class="page-subtitle">Have a project in mind or want to talk about design and development? Drop me a message below!</p>
        
        <div class="contact-container">
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Your Name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Your Email Address" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="6" placeholder="Tell me about your project..." required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </main>
  <script src="script.js"></script>
</body>
</html>
